<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}OpsAgent{% endblock %}</title>
<style>
  :root { color-scheme: light; background: #fff; }
  body { font-family: system-ui, sans-serif; margin: 2rem auto; max-width: 60rem; padding: 0 1rem; color: #1a1a1a; background: #fff; line-height: 1.45; }
  nav { margin-bottom: 1.5rem; }
  nav a { margin-right: 1rem; }
  h1 { font-size: 1.4rem; margin-top: 2rem; }
  h2 { font-size: 1.1rem; margin: 0 0 .5rem; }
  .card { border: 1px solid #ccc; border-radius: 6px; padding: 1rem 1.25rem; margin: 1rem 0; }
  .reason { font-weight: 600; }
  .customer { white-space: pre-wrap; background: #f6f6f6; padding: .75rem; border-radius: 4px; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: .25rem 1rem; }
  dt { color: #555; }
  dd { margin: 0; }
  form { margin-top: .75rem; }
  textarea { width: 100%; box-sizing: border-box; }
  .warning { background: #fff4e5; border: 1px solid #f0b36b; padding: .75rem; border-radius: 4px; }
  table { border-collapse: collapse; width: 100%; font-size: .9rem; }
  th, td { text-align: left; padding: .3rem .5rem; border-bottom: 1px solid #eee; vertical-align: top; }
  th { color: #555; font-weight: 600; }
  .note { color: #555; font-size: .9rem; }
  tr[data-depth="0"] { background: #f3f3f3; font-weight: 600; }
  tr[data-depth="1"] td.name { padding-left: 1.5rem; }
  tr[data-depth="2"] td.name { padding-left: 3rem; }
  tr[data-depth="3"] td.name { padding-left: 4.5rem; }
  tr.error td { color: #9b1c1c; }
  td.cost, td.ms, td.tokens { white-space: nowrap; }
</style>
</head>
<body>
<nav><a href="/approvals">Approvals</a><a href="/guardrails">Guardrails</a><a href="/runs">Runs</a></nav>
{% block content %}{% endblock %}
</body>
</html>
