[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --cov=experiments --cov=app --cov-report=term-missing --cov-fail-under=80"
markers = [
    # Needs the Postgres from docker-compose.yml. These FAIL rather than skip when
    # it is absent -- see tests/conftest.py for why.
    "db: requires a live database",
]

[tool.coverage.report]
# Network calls and interactive CLI drivers are marked `# pragma: no cover`.
# Business logic is never excluded; it is tested instead.
exclude_also = ["if __name__ == .__main__.:"]

[tool.ruff]
# Rules come from the pinned ruff version's defaults, so CI and local agree.
target-version = "py313"

[tool.mypy]
python_version = "3.13"
files = ["app"]
ignore_missing_imports = true
