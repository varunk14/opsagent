# Mirrors the ECC verification loop: build, types, lint, tests, security.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: opsagent
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: opsagent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opsagent -d opsagent"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20

    env:
      OPSAGENT_DATABASE_URL: postgresql://opsagent:dev@localhost:5432/opsagent
      OPSAGENT_TEST_DATABASE_URL: postgresql://opsagent:dev@localhost:5432/opsagent_test

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Build
        run: python -m compileall -q app evals experiments tests

      - name: Types
        run: mypy

      - name: Lint
        run: ruff check .

      - name: Create test database
        # Same bootstrap the local container runs at first start.
        run: PGPASSWORD=dev psql -h localhost -U opsagent -d opsagent -f migrations/000_bootstrap.sql

      - name: Tests
        run: pytest

      - name: Secret scan
        run: |
          if grep -rnE "sk-[A-Za-z0-9]{10,}|sk-lf-[0-9a-f-]{20,}|ghp_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY" \
               --include="*.py" --include="*.yml" --include="*.toml" --include="*.json*" --include="*.md" .; then
            echo "Possible secret committed"; exit 1
          fi

  evals:
    # Replays the committed recordings through the real driver against its own Postgres, scores
    # them, replays the judge's recorded verdicts on the smoke cases for the scoreboard, and fails
    # on anything worse than evals/baseline.json or any case that became unsafe. No model runs here:
    # recording happens on a machine with one (python -m evals record).
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: opsagent
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: opsagent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opsagent -d opsagent"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20

    env:
      OPSAGENT_DATABASE_URL: postgresql://opsagent:dev@localhost:5432/opsagent
      OPSAGENT_EVAL_ADMIN_URL: postgresql://opsagent:dev@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Evaluation gate
        run: python -m evals gate
