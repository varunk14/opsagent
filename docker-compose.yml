# Local development stack. Everything here is open source and runs offline.
# Langfuse and ClickHouse arrive when tracing does.
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: opsagent-db
    environment:
      POSTGRES_USER: opsagent
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: opsagent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations/000_bootstrap.sql:/docker-entrypoint-initdb.d/000_bootstrap.sql:ro
    healthcheck:
      # Compose waits on this, so tests never race a half-started database.
      test: ["CMD-SHELL", "pg_isready -U opsagent -d opsagent"]
      interval: 3s
      timeout: 3s
      retries: 20

  cache:
    # Nothing consumes this yet, and that is deliberate. It is here because the
    # caching and rate limiting it will hold are the difference between the cost
    # figure in BASELINE.md and the one week 9 reports, and adding a service to a
    # stack people already have running is more disruptive than starting with it.
    image: redis:7-alpine
    container_name: opsagent-cache
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
